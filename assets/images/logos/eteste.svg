<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -102 204 204" width="100%" height="100%">
  <style>
    /* 默认颜色（浅色模式下的深绿色） */
    .icon-stroke {
      stroke: #1e5224;
    }
    /* 深色模式下的颜色（浅绿色，防止在黑色标签页中看不清） */
    @media (prefers-color-scheme: dark) {
      .icon-stroke {
        stroke: #4ade80; /* 如果你不喜欢这个浅绿色，可以换成其他颜色，比如白色 #ffffff */
      }
    }
  </style>
  
  <g class="icon-stroke" fill="none" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round">
    <g id="fixed-head">
      <rect x="-55" y="-95" width="110" height="65" rx="32" stroke-dasharray="25 15"></rect>
      <path d="M -30,-62 C -23,-59.5 -15,-58.5 -8,-58" stroke-width="12.5"></path>
      <path d="M 6,-57 C 14,-56 22,-58 30,-62"></path>
    </g>
    <g stroke-dasharray="25 15">
      <g id="user-branch-A" transform="translate(0, 1)">
        <path d="M -15,-30 C -15,20 -45,50 -80,60"></path>
      </g>
      <g id="user-branch-B" transform="translate(0, 0)">
        <path d="M 5,-15 C 50,0 85,35 85,80 C 85,95 65,100 55,90"></path>
      </g>
      <g id="user-branch-C" transform="translate(-4, -10)">
        <path d="M 15,25 C 25,45 20,65 5,80"></path>
        <path d="M 45,15 C 55,35 50,55 35,70"></path>
      </g>
    </g>
  </g>
</svg>